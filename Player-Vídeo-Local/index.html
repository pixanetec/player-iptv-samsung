<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- Palavras-chave para SEO -->
  <meta name="description" content="Aprenda a instalar IPTV na TV Samsung com este guia completo passo a passo. Funciona em modelos 2020, 2021, 2022, 2023+">
  <meta name="keywords" content="IPTV na TV Samsung, como instalar IPTV Samsung, tutorial IPTV passo a passo, guia completo IPTV, TV Samsung IPTV">
  <title>Instalar IPTV na TV Samsung - Guia Completo Passo a Passo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Arial', sans-serif;
      background: #000;
      color: white;
      text-align: center;
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(135deg, #0f0f0f, #1a0000);
    }
    header {
      margin-bottom: 20px;
    }
    h1 {
      color: #ff0000;
      font-size: 32px;
      margin: 15px 0;
      text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000;
      animation: pulse 1.5s infinite alternate;
    }
    @keyframes pulse {
      from { text-shadow: 0 0 10px #ff0000; }
      to { text-shadow: 0 0 15px #ff0000, 0 0 25px #ff3333; }
    }
    .highlight {
      display: block;
      font-size: 18px;
      color: #fff;
      background: rgba(255, 0, 0, 0.2);
      padding: 10px;
      border-radius: 8px;
      margin: 10px auto;
      max-width: 800px;
      font-weight: bold;
      text-shadow: 0 0 5px #ff0000;
      border-left: 4px solid #ff0000;
    }
    .player-container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      background: rgba(30, 0, 0, 0.5);
      border-radius: 14px;
      box-shadow: 
        0 0 15px rgba(255, 0, 0, 0.4),
        0 0 30px rgba(255, 0, 0, 0.3);
      border: 1px solid #ff0000;
    }
    video {
      width: 100%;
      height: auto;
      border-radius: 12px;
      background: #000;
      box-shadow: 
        0 0 15px rgba(255, 0, 0, 0.5),
        0 0 25px rgba(255, 0, 0, 0.3) inset;
      border: 2px solid #ff3333;
    }
    .muted-notice {
      display: block;
      margin-top: 12px;
      font-size: 14px;
      color: #ff6666;
      font-weight: bold;
      text-shadow: 0 0 5px #ff0000;
    }
    .instructions {
      margin-top: 20px;
      font-size: 14px;
      color: #aaa;
    }
    .instructions p {
      color: #ff6666;
    }
    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <h1>🔴 PLAYER STREAMING</h1>
    <span class="highlight">
      📺 Instalar IPTV na TV Samsung: Tutorial Passo a Passo [Guia Completo]
    </span>
  </header>

  <div class="player-container">
    <video id="videoPlayer" controls autoplay muted>
      <source src="videos/iptv_plus_na_tv_samsung.mp4" type="video/mp4">
      Seu navegador não suporta o formato MP4.
    </video>
    <span class="muted-notice">🔊 Clique no player para ativar o som</span>
  </div>

  <div class="instructions">
    <p>▶️ O vídeo inicia automaticamente em mudo</p>
    <p>🖱️ Clique para ligar o áudio e assistir</p>
  </div>

  <footer>
    <p>Guia prático para configurar IPTV em TVs Samsung | Otimizado para busca</p>
  </footer>

  <script>
    const video = document.getElementById('videoPlayer');

    video.addEventListener('loadedmetadata', () => {
      console.log("✅ Vídeo carregado com sucesso!");
    });

    video.play().catch(e => {
      console.log("❌ Autoplay bloqueado:", e);
    });

    video.addEventListener('click', function() {
      video.muted = !video.muted;
      console.log("🔊 Áudio " + (video.muted ? "mutado" : "ativado"));
    });
  </script>

</body>
</html>
